name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, data and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `biome ci` rather than the local `format --write`, which would pass by
      # rewriting the file instead of reporting it.
      - run: npm run check:ci

  extension:
    name: Lorestep for Chrome (extension/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Biome from the root lockfile; extension/biome.json extends the root config
      # (lineWidth 120, classic-script "use strict"). The check job's `biome ci .`
      # also covers extension/; this keeps the extension's own result readable.
      - run: npm ci --ignore-scripts

      - run: npx biome ci extension

      # Syntax, manifest/host consistency, pinned key, forbidden sinks, then the
      # node:test unit tests. Plain Node: extension/package.json has no dependencies.
      - run: npm run check
        working-directory: extension

      - name: Package the extension
        working-directory: extension
        run: zip -r ../lorestep-for-chrome.zip manifest.json background.js core adapters library icons fonts

      - uses: actions/upload-artifact@v4
        with:
          name: lorestep-for-chrome-${{ github.sha }}
          path: lorestep-for-chrome.zip
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    # The home, games and screen pages read the database at build time, so a
    # build without a connection string fails by design rather than silently
    # producing an empty site. Skipped rather than faked when the secret is
    # absent, so a fork's pull request still gets the check job above.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Assert the content routes are still prerendered
        run: npm run check:static

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Playwright builds and starts the app itself (see playwright.config.ts), and
    # the content pages read the database at build time. The auth tests will sign
    # users up, so they run against a Neon CI branch (DATABASE_URL_CI), never production:
    # the job migrates and seeds that branch first. Without both secrets every step
    # below is skipped with a notice, never faked. Runs on pushes and on this
    # repository's own pull requests; a fork's pull request gets no secrets and
    # is not run at all.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      APP_ORIGIN: http://localhost:3001
      EXTENSION_OAUTH_CLIENT_ID: ci
      NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL_CI }}
    steps:
      - name: Check for the CI database
        id: db
        env:
          DATABASE_URL_CI: ${{ secrets.DATABASE_URL_CI }}
        run: |
          if [ -n "$DATABASE_URL_CI" ] && [ -n "$NEON_AUTH_BASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Browser tests skipped::DATABASE_URL_CI or NEON_AUTH_BASE_URL_CI is not set, so nothing below ran. Create the Neon CI branch with Neon Auth enabled and add both secrets (PLAN.md section 12.4, steps 5 and 9)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.db.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.db.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.db.outputs.ready == 'true'

      # A fresh secret per run: nothing outside this job ever holds it.
      - name: Generate NEON_AUTH_COOKIE_SECRET
        if: steps.db.outputs.ready == 'true'
        run: |
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "NEON_AUTH_COOKIE_SECRET=$secret" >> "$GITHUB_ENV"

      - run: npm run db:migrate
        if: steps.db.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}

      # The script directly, not `npm run data:seed`: that passes
      # --env-file=.env.local, and Node exits when the file is missing.
      - run: node scripts/seed-db.mjs
        if: steps.db.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}

      # Chromium only: playwright.config.ts declares one project, so the other
      # two engines would be ~300 MB nothing runs.
      #
      # No `--with-deps`. It runs `apt-get update`, and the runner image ships a
      # Google Chrome apt source that failed the first run of this job with
      # `Hash Sum mismatch` on dl.google.com — a third-party mirror on the
      # critical path of every build. The image already carries Chrome and Edge,
      # so the shared libraries Chromium needs are present without it.
      - run: npx playwright install chromium
        if: steps.db.outputs.ready == 'true'

      - run: npm run test:e2e
        if: steps.db.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}

      # `reporter: "list"` prints one line per failure and nothing else, which is
      # not enough to diagnose a failure that only reproduces on the runner. The
      # config traces on first retry; without this the trace is thrown away.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
